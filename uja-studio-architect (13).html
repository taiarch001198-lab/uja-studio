<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UJA STUDIO · ARCHITECT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --sand:#F5F0E8;--sand2:#EDE6D6;--clay:#C8A882;--clay-dark:#8B6E4E;
  --earth:#5C4A35;--olive:#7A8C6E;--olive-light:#B5C4A8;
  --charcoal:#2C2820;--warm-white:#FAF8F4;--accent:#D4815A;
  --accent-light:#F0C4A8;--muted:#9E917E;--border:rgba(140,110,78,0.18);
  --danger:#C04A35;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Georgia,serif;background:var(--warm-white);color:var(--charcoal);}
#app{min-height:100vh;}
.pg{display:none;}.pg.on{display:block;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 30px;background:var(--warm-white);border-bottom:.5px solid var(--border);position:sticky;top:0;z-index:100;}
.logo{font-size:15px;letter-spacing:2px;cursor:pointer;display:flex;align-items:baseline;}
.logo-uja{color:var(--earth);}
.logo-studio{color:var(--accent);}
.logo-sep{color:var(--clay);font-size:11px;margin:0 5px;}
.logo-arch{color:var(--muted);font-size:11px;letter-spacing:1.5px;}
.navlinks{display:flex;align-items:center;gap:18px;}
.nl{font-size:13px;color:var(--muted);cursor:pointer;border:none;background:none;font-family:Georgia,serif;transition:color .2s;}
.nl:hover,.nl.act{color:var(--earth);}
.btn-border{background:none;border:.5px solid var(--clay);color:var(--earth);padding:7px 14px;font-size:12px;cursor:pointer;font-family:Georgia,serif;border-radius:2px;}
.btn-border:hover{background:var(--sand);}
.btn-fill{background:var(--accent);color:var(--warm-white);border:none;padding:7px 14px;font-size:12px;cursor:pointer;font-family:Georgia,serif;border-radius:2px;}
.btn-fill:hover{background:var(--clay-dark);}
.loginbg{min-height:calc(100vh - 57px);display:flex;align-items:center;justify-content:center;padding:40px 20px;background:rgba(44,40,32,.5);}
.lcard{background:var(--warm-white);border:.5px solid var(--border);border-radius:4px;padding:38px 34px;width:360px;}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
.fld label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-family:sans-serif;}
.fi{width:100%;border:.5px solid var(--border);border-radius:2px;padding:9px 11px;font-size:13px;background:var(--sand);color:var(--charcoal);font-family:Georgia,serif;}
.fi:focus{outline:none;border-color:var(--clay);}
.btnfull{width:100%;background:var(--earth);color:var(--warm-white);border:none;padding:12px;font-size:13px;cursor:pointer;font-family:Georgia,serif;border-radius:2px;}
.btnfull:hover{background:var(--clay-dark);}
.lerr{background:#FDF0EE;border:.5px solid rgba(192,74,53,.3);border-radius:2px;padding:9px 12px;font-size:12px;color:var(--danger);margin-bottom:12px;font-family:sans-serif;display:none;}
.login-hint{text-align:center;margin-top:16px;font-size:11px;color:var(--muted);font-family:sans-serif;padding:10px;background:var(--sand);border-radius:2px;cursor:pointer;border:.5px solid transparent;}
.login-hint:hover{border-color:var(--clay);}
.hero{display:grid;grid-template-columns:1fr 1fr;background:var(--sand);}
.herotext{padding:52px 38px;display:flex;flex-direction:column;justify-content:center;}
.eyebrow{font-size:11px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;font-family:sans-serif;margin-bottom:16px;}
.herotitle{font-size:36px;font-weight:normal;line-height:1.3;margin-bottom:16px;}
.herotitle em{font-style:italic;color:var(--clay-dark);}
.herodesc{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:26px;}
.ctarow{display:flex;gap:10px;}
.cta-link-fill{display:inline-block;background:var(--accent);color:var(--warm-white);padding:11px 24px;font-size:13px;font-family:Georgia,serif;border-radius:2px;border:none;cursor:pointer;text-decoration:none;}
.cta-link-fill:hover{background:var(--clay-dark);}
.cta-link-outline{display:inline-block;background:transparent;color:var(--earth);border:.5px solid var(--clay);padding:11px 24px;font-size:13px;font-family:Georgia,serif;border-radius:2px;cursor:pointer;text-decoration:none;}
.cta-link-outline:hover{background:var(--sand2);}
.cta-link-white{display:inline-block;background:var(--warm-white);color:var(--earth);padding:11px 24px;font-size:13px;font-family:Georgia,serif;border-radius:2px;border:none;cursor:pointer;text-decoration:none;white-space:nowrap;}
.statsbar{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:.5px solid var(--border);}
.statitem{padding:22px 26px;border-right:.5px solid var(--border);text-align:center;}
.statitem:last-child{border-right:none;}
.statnum{font-size:26px;font-style:italic;color:var(--clay-dark);}
.statlbl{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:3px;font-family:sans-serif;}
.sec{padding:52px 38px;}
.sectitle{font-size:27px;font-weight:normal;margin-bottom:7px;}
.sectitle em{font-style:italic;color:var(--clay-dark);}
.teamsec{background:var(--sand);padding:52px 38px;}
.portgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.portcard{background:var(--sand);border:.5px solid var(--border);border-radius:2px;overflow:hidden;cursor:pointer;transition:transform .2s;}
.portcard:hover{transform:translateY(-3px);}
.site-footer{background:var(--charcoal);color:var(--warm-white);padding:46px 38px 26px;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:38px;margin-bottom:32px;}
.footer-col-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-family:sans-serif;color:var(--accent);margin-bottom:14px;}
.footer-info-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px;}
.footer-info-row i{font-size:14px;color:var(--clay);margin-top:2px;flex-shrink:0;}
.footer-info-text{font-size:12px;color:rgba(250,248,244,.75);line-height:1.7;}
.footer-hours-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:.5px solid rgba(250,248,244,.08);font-size:12px;}
.footer-hours-row:last-child{border-bottom:none;}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:22px;border-top:.5px solid rgba(250,248,244,.1);font-size:11px;color:rgba(250,248,244,.3);font-family:sans-serif;}
.appshell{display:flex;height:calc(100vh - 57px);overflow:hidden;}
.sidebar{width:185px;background:var(--sand);border-right:.5px solid var(--border);padding:14px 0;flex-shrink:0;overflow-y:auto;}
.sb-brand{padding:12px 15px 14px;border-bottom:.5px solid var(--border);margin-bottom:6px;}
.sb-brand-name{font-size:12px;letter-spacing:1.5px;color:var(--earth);}
.sb-brand-name span{color:var(--accent);}
.sb-brand-sub{font-size:9px;letter-spacing:2px;color:var(--muted);font-family:sans-serif;margin-top:2px;text-transform:uppercase;}
.sb-session{display:flex;align-items:center;gap:6px;margin-top:8px;padding:5px 8px;background:rgba(122,140,110,.1);border-radius:2px;}
.sb-dot{width:6px;height:6px;border-radius:50%;background:var(--olive);flex-shrink:0;}
.sb-txt{font-size:10px;color:var(--olive);font-family:sans-serif;}
.sblbl{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-family:sans-serif;padding:5px 15px 3px;}
.sbitem{display:flex;align-items:center;gap:8px;padding:9px 15px;font-size:13px;color:var(--muted);cursor:pointer;border-left:2px solid transparent;}
.sbitem:hover{color:var(--charcoal);background:var(--sand2);}
.sbitem.on{color:var(--earth);background:var(--sand2);border-left-color:var(--accent);}
.mainarea{flex:1;padding:22px 26px;min-width:0;}
.ed-grid{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start;height:calc(100vh - 57px - 44px - 60px);}
.ed-panel{display:flex;flex-direction:column;gap:0;}
.ed-group{background:var(--sand);border:.5px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:1px;}
.eg-head:hover{background:var(--sand2);}
.eg-head{padding:10px 13px;font-size:12px;color:var(--charcoal);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background .15s;}
.eg-head i{font-size:13px;color:var(--clay-dark);}
.eg-body{padding:11px 12px;border-top:.5px solid var(--border);}
.ef-label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-family:sans-serif;margin-bottom:4px;}
.ef-inp{width:100%;border:.5px solid var(--border);border-radius:2px;padding:7px 9px;font-size:12px;background:var(--warm-white);color:var(--charcoal);font-family:Georgia,serif;}
.ef-inp:focus{outline:none;border-color:var(--clay);}
.preview-wrap{border:.5px solid var(--border);border-radius:4px;overflow:hidden;height:100%;}
.preview-bar{background:var(--sand2);padding:8px 13px;border-bottom:.5px solid var(--border);font-size:11px;color:var(--muted);font-family:sans-serif;display:flex;align-items:center;justify-content:space-between;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px;}
.preview-scroll{overflow-y:auto;height:calc(100% - 37px);scrollbar-width:thin;scrollbar-color:var(--clay) var(--sand2);}
[data-ek].edon:hover{outline:1.5px dashed var(--clay);outline-offset:3px;}
[data-ek].edon:focus{outline:2px solid var(--accent);outline-offset:3px;background:rgba(212,129,90,.06);}
.tog{position:relative;width:34px;height:18px;flex-shrink:0;}
.tog input{opacity:0;width:0;height:0;}
.togslider{position:absolute;inset:0;background:var(--sand2);border-radius:10px;cursor:pointer;border:.5px solid var(--border);}
.togslider:before{content:"";position:absolute;width:13px;height:13px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:transform .2s,background .2s;}
input:checked+.togslider{background:rgba(122,140,110,.2);border-color:rgba(181,196,168,.6);}
input:checked+.togslider:before{transform:translateX(16px);background:var(--olive);}
.icon-picker-wrap{position:relative;}
.icon-preview-btn{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--warm-white);border:.5px solid var(--border);border-radius:2px;cursor:pointer;font-size:12px;color:var(--charcoal);width:100%;}
.icon-preview-btn i{font-size:16px;color:var(--clay-dark);}
.icon-dropdown{position:absolute;top:calc(100% + 4px);left:0;width:220px;background:var(--warm-white);border:.5px solid var(--border);border-radius:4px;box-shadow:0 4px 16px rgba(44,40,32,.12);z-index:200;padding:8px;}
.icon-search{width:100%;border:.5px solid var(--border);border-radius:2px;padding:6px 8px;font-size:11px;background:var(--sand);color:var(--charcoal);margin-bottom:7px;font-family:sans-serif;}
.icon-search:focus{outline:none;border-color:var(--clay);}
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;max-height:150px;overflow-y:auto;}
.icon-opt{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:2px;cursor:pointer;font-size:16px;color:var(--muted);}
.icon-opt:hover{background:var(--sand2);color:var(--earth);}
.icon-opt.sel{background:rgba(212,129,90,.15);color:var(--accent);}
.color-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.color-dot:hover,.color-dot.sel{border-color:var(--earth);}
.qrow{display:grid;grid-template-columns:1.8fr .55fr .75fr .85fr 26px;gap:6px;align-items:center;padding:7px 0;border-bottom:.5px solid var(--border);}
.qrow.hdr{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-family:sans-serif;}
.qi{width:100%;border:.5px solid var(--border);border-radius:2px;padding:7px 8px;font-size:12px;background:var(--sand);color:var(--charcoal);font-family:Georgia,serif;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-family:sans-serif;padding:7px 10px;border-bottom:.5px solid var(--border);text-align:left;font-weight:normal;}
.tbl td{padding:10px;border-bottom:.5px solid var(--border);font-size:13px;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--sand);}
.spill{font-size:10px;padding:3px 9px;border-radius:2px;font-family:sans-serif;}
.sa{background:rgba(122,140,110,.15);color:var(--olive);}
.sr{background:rgba(212,129,90,.15);color:var(--accent);}
.sp{background:rgba(140,110,78,.15);color:var(--clay-dark);}
.ptw{position:relative;height:115px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.ptw img{width:100%;height:100%;object-fit:cover;}
.pto{position:absolute;inset:0;background:rgba(44,40,32,.5);display:flex;align-items:center;justify-content:center;gap:7px;opacity:0;transition:opacity .2s;}
.pc:hover .pto{opacity:1;}
.peb{background:var(--warm-white);border:none;border-radius:2px;padding:5px 11px;font-size:11px;cursor:pointer;color:var(--earth);font-family:sans-serif;}
.upload-zone{border:1.5px dashed var(--clay);border-radius:4px;padding:28px 18px;text-align:center;cursor:pointer;}
.upload-zone:hover,.upload-zone.dov{background:var(--sand2);}
.img-tw{position:relative;width:74px;height:74px;border-radius:3px;overflow:hidden;border:.5px solid var(--border);}
.img-tw img{width:100%;height:100%;object-fit:cover;}
.img-rm{position:absolute;top:2px;right:2px;background:rgba(44,40,32,.7);border:none;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:white;font-size:10px;}
.modal-bg{background:rgba(44,40,32,.45);padding:36px 18px;display:flex;align-items:flex-start;justify-content:center;}
.modal-box{background:var(--warm-white);border:.5px solid var(--border);border-radius:4px;padding:24px;width:460px;}
.mfrow{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px;}
.mfl{display:flex;flex-direction:column;gap:5px;}
.mfl label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-family:sans-serif;}
.hours-editor-row{display:grid;grid-template-columns:85px 1fr 26px;gap:6px;align-items:center;margin-bottom:6px;}
.hours-editor-row input{border:.5px solid var(--border);border-radius:2px;padding:6px 8px;font-size:11px;background:var(--warm-white);color:var(--charcoal);font-family:sans-serif;width:100%;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--earth);color:var(--warm-white);border-radius:3px;padding:10px 16px;font-size:12px;font-family:sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}

.port-detail-hero{height:340px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.port-detail-hero img{width:100%;height:100%;object-fit:cover;}
.port-thumb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
.port-thumb-grid img{width:100%;height:88px;object-fit:cover;border-radius:2px;cursor:pointer;border:.5px solid var(--border);transition:opacity .2s;}
.port-thumb-grid img:hover{opacity:.8;}
.legal-content h2{font-size:26px;font-weight:normal;margin-bottom:18px;color:var(--earth);}
.legal-content h3{font-size:15px;font-weight:normal;margin:22px 0 8px;color:var(--clay-dark);border-bottom:.5px solid var(--border);padding-bottom:6px;}
.legal-content p{font-size:14px;color:var(--muted);line-height:1.9;margin-bottom:10px;}

/* Lightbox */
#lightbox-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#lightbox-overlay.open{opacity:1;pointer-events:all;}
#lightbox-img{
  max-width:90vw;max-height:85vh;object-fit:contain;
  border-radius:2px;box-shadow:0 8px 48px rgba(0,0,0,.6);
  transition:opacity .2s;
}
#lightbox-close{
  position:fixed;top:18px;right:22px;background:none;border:none;
  color:rgba(255,255,255,.7);font-size:28px;cursor:pointer;line-height:1;
  z-index:1001;transition:color .15s;
}
#lightbox-close:hover{color:#fff;}
#lightbox-prev,#lightbox-next{
  position:fixed;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.1);border:none;color:#fff;
  font-size:22px;cursor:pointer;padding:14px 18px;border-radius:2px;
  transition:background .15s;z-index:1001;
}
#lightbox-prev{left:16px;}
#lightbox-next{right:16px;}
#lightbox-prev:hover,#lightbox-next:hover{background:rgba(255,255,255,.2);}
#lightbox-counter{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.5);font-size:12px;font-family:sans-serif;
  letter-spacing:2px;z-index:1001;
}
.port-thumb-grid img{cursor:zoom-in;}

/* ═══════════════════════════════
   手機版響應式設計
═══════════════════════════════ */
@media (max-width: 768px){

  /* NAV */
  .nav{padding:12px 16px;}
  .logo-uja,.logo-studio{font-size:14px;}
  .logo-arch{font-size:10px;}
  .nl{font-size:12px;}
  #navauth button{font-size:11px;padding:6px 10px;}

  /* HERO */
  .hero{grid-template-columns:1fr !important;display:block !important;}
  .herotext{padding:32px 20px !important;}
  .herotitle{font-size:26px !important;}
  .herodesc{font-size:13px !important;}
  .ctarow{flex-wrap:wrap;}
  .cta-link-fill,.cta-link-outline{font-size:12px;padding:9px 16px;}
  .herovis{display:none !important;}

  /* STATS */
  .statsbar{grid-template-columns:repeat(2,1fr) !important;}
  .statitem{padding:14px 12px !important;}
  .statnum{font-size:20px !important;}

  /* SECTIONS */
  .sec{padding:32px 20px !important;}
  .sectitle{font-size:22px !important;}
  .svcgrid{grid-template-columns:1fr !important;}
  .svcard{padding:16px !important;}

  /* PROCESS STEPS */
  .psteps{grid-template-columns:repeat(2,1fr) !important;}
  .pstep{padding:16px !important;}
  .pnum{font-size:22px !important;}

  /* TEAM */
  .teamsec{padding:32px 20px !important;}
  .teamgrid{grid-template-columns:repeat(2,1fr) !important;}

  /* CTA BAND */
  .ctaband{flex-direction:column !important;padding:28px 20px !important;gap:16px !important;}
  .ctaband h2{font-size:18px !important;}
  .cta-link-white{width:100%;text-align:center;}

  /* PORTFOLIO */
  .portgrid{grid-template-columns:repeat(2,1fr) !important;gap:10px !important;}

  /* FOOTER */
  .site-footer{padding:32px 20px 20px !important;}
  .footer-grid{grid-template-columns:1fr !important;gap:24px !important;}
  .footer-bottom{flex-direction:column;gap:10px;text-align:center;}

  /* PORT DETAIL */
  .port-detail-hero{height:220px !important;}
  .port-thumb-grid{grid-template-columns:repeat(3,1fr) !important;}
  [style*="padding:28px 38px"]{padding:20px 16px !important;}
  [style*="padding:28px 32px"]{padding:20px 16px !important;flex-direction:column !important;}

  /* LEGAL PAGES */
  .legal-content h2{font-size:20px !important;}
  .legal-content h3{font-size:14px !important;}

  /* APP BACKEND */
  .appshell{flex-direction:column !important;height:auto !important;}
  .sidebar{width:100% !important;height:auto !important;border-right:none !important;border-bottom:.5px solid var(--border);}
  .sblbl{display:none;}
  .sbitem{display:inline-flex !important;padding:8px 12px !important;font-size:11px !important;border-left:none !important;border-bottom:2px solid transparent !important;}
  .sbitem.on{border-bottom-color:var(--accent) !important;border-left:none !important;}
  .sidebar .sb-brand{display:none;}
  #sidebar{display:flex;flex-wrap:wrap;overflow-x:auto;padding:0;}
  .mainarea{padding:16px !important;max-height:none !important;}
  .ed-grid{grid-template-columns:1fr !important;height:auto !important;}
  .preview-wrap{display:none !important;}
  .ed-panel{max-height:none !important;overflow-y:visible !important;}

  /* CONTACT FORM */
  [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr !important;}

  /* LIGHTBOX */
  #lightbox-prev{left:6px;padding:10px 12px;}
  #lightbox-next{right:6px;padding:10px 12px;}
  #lightbox-img{max-width:95vw !important;max-height:80vh !important;}

  /* LOGIN */
  .loginbg{padding:20px 12px !important;}
  .lcard{width:100% !important;max-width:360px;padding:28px 20px !important;}

  /* BACK BUTTON */
  .btn-border,.btn-fill{font-size:12px !important;padding:7px 12px !important;}
}

@media (max-width: 480px){
  .portgrid{grid-template-columns:1fr !important;}
  .psteps{grid-template-columns:1fr !important;}
  .teamgrid{grid-template-columns:repeat(2,1fr) !important;}
  .statsbar{grid-template-columns:repeat(2,1fr) !important;}
  .herotitle{font-size:22px !important;}
  .port-thumb-grid{grid-template-columns:repeat(2,1fr) !important;}
}
</style>
</head>
<body>
<div id="app">
<div id="toast" class="toast"></div>

function fill(u,p){document.getElementById('iu').value=u;document.getElementById('ip').value=p;}
function doLogin(){
  var u=document.getElementById('iu').value.trim(),p=document.getElementById('ip').value;
  if(u===CU&&p===CP){
    loggedIn=true;
    document.getElementById('lerr').style.display='none';
    var rem=document.getElementById('remember-me');
    if(rem&&rem.checked){
      try{localStorage.setItem('uja_u',u);localStorage.setItem('uja_p',p);}catch(e){}
    } else {
      try{localStorage.removeItem('uja_u');localStorage.removeItem('uja_p');}catch(e){}
    }
    renderNavAuth();goPage('app');renderSidebar();showSec('web-editor');
  } else {
    document.getElementById('lerr').style.display='block';
  }
}

    b.textContent='\u54e1\u5de5\u767b\u5165';b.onclick=function(){goPage('login');};

function goPage(id, data){
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on');});
  var pg=document.getElementById('pg-'+id);
  if(!pg) return;
  pg.classList.add('on');
  ['home','port','contact'].forEach(function(k){var e=document.getElementById('nl-'+k);if(e)e.classList.remove('act');});
  window.scrollTo(0,0);
  if(id==='home'){document.getElementById('nl-home').classList.add('act');renderPubHome();}
  if(id==='port'){document.getElementById('nl-port').classList.add('act');renderPubPort();document.getElementById('port-footer').innerHTML=buildFooter();}
  if(id==='contact'){document.getElementById('nl-contact').classList.add('act');document.getElementById('contact-footer').innerHTML=buildFooter();}
  if(id==='port-detail'&&data!==undefined){renderPortDetail(data);}
  if(id==='privacy'){renderLegalPage('privacy');}
  if(id==='terms'){renderLegalPage('terms');}
}

/* ─── SCSET from inline edit ─── */
function scSet(k,v){
  if(k==='hero_eyebrow') SC.hero.eyebrow=v;
  else if(k==='hero_title') SC.hero.title=v;
  else if(k==='hero_desc') SC.hero.desc=v;
  else if(k==='hero_cta1') SC.hero.cta1=v;
  else if(k==='hero_cta2') SC.hero.cta2=v;
  else if(k==='cta_title') SC.cta.title=v;
  else if(k==='cta_sub') SC.cta.sub=v;
  else if(k==='cta_btn') SC.cta.btn=v;
  else if(k.startsWith('stat_')){var p=k.split('_');SC.stats[+p[1]][p[2]]=v;}
  else if(k.startsWith('svc_')){var p=k.split('_');SC.services[+p[1]][p[2]]=v;}
  else if(k.startsWith('proc_')){var p=k.split('_');SC.process[+p[1]][p[2]]=v;}
  else if(k.startsWith('team_')){var p=k.split('_');SC.team[+p[1]][p[2]]=v;}
}

function closeIP(){openIPicker=null;document.querySelectorAll('.icon-dropdown').forEach(function(d){d.remove();});}
function showIP(btnId,cur,cb){
  closeIP();
  var btn=document.getElementById(btnId);if(!btn)return;
  var sid='is'+Date.now(),gid='ig'+btnId;
  var d=document.createElement('div');d.className='icon-dropdown';
  /* build with DOM to avoid quote-escaping issues */
  var searchInp=document.createElement('input');
  searchInp.className='icon-search';searchInp.placeholder='搜尋圖示...';searchInp.id=sid;
  searchInp.oninput=function(){filtIcons(this.value,gid);};
  var grid=document.createElement('div');grid.className='icon-grid';grid.id=gid;
  ALL_ICONS.forEach(function(ic){
    var opt=document.createElement('div');
    opt.className='icon-opt'+(ic===cur?' sel':'');
    opt.title=ic;
    opt.innerHTML='<i class="ti '+ic+'"></i>';
    opt.onclick=function(){cb(ic);closeIP();};
    grid.appendChild(opt);
  });
  d.appendChild(searchInp);d.appendChild(grid);
  btn.appendChild(d);openIPicker=btnId;
  setTimeout(function(){searchInp.focus();},50);
  document.addEventListener('click',function oc(e){if(!btn.contains(e.target)){closeIP();document.removeEventListener('click',oc);}});
}

function filtIcons(q,gid){var g=document.getElementById(gid);if(!g)return;var lo=q.toLowerCase();g.querySelectorAll('.icon-opt').forEach(function(el){el.style.display=el.title.includes(lo)?'':'none';});}

  /* helper: text field */
  function addField(parent,label,getValue,setValue){
    var w=document.createElement('div');w.style.marginBottom='10px';
    var lbl=document.createElement('div');lbl.className='ef-label';lbl.textContent=label;
    var inp=document.createElement('input');inp.className='ef-inp';
    inp.value=(getValue()||'').replace(/<[^>]*>/g,'');
    inp.oninput=function(){setValue(this.value);rp();};
    w.appendChild(lbl);w.appendChild(inp);parent.appendChild(w);
    return inp;
  }

  /* helper: textarea field */
  function addTA(parent,label,getValue,setValue){
    var w=document.createElement('div');w.style.marginBottom='10px';
    var lbl=document.createElement('div');lbl.className='ef-label';lbl.textContent=label;
    var ta=document.createElement('textarea');ta.className='ef-inp';ta.rows=2;ta.style.resize='none';
    ta.value=(getValue()||'').replace(/<[^>]*>/g,'');
    ta.oninput=function(){setValue(this.value);rp();};
    w.appendChild(lbl);w.appendChild(ta);parent.appendChild(w);
    return ta;
  }

  /* helper: color palette */
  function addPalette(parent,getCurrent,onPick){
    var row=document.createElement('div');
    row.style.cssText='display:flex;gap:4px;flex-wrap:wrap;margin-top:5px';
    PAL.forEach(function(c){
      var d=document.createElement('div');
      d.className='color-dot'+(getCurrent()===c?' sel':'');
      d.style.background=c;d.title=c;
      d.onclick=function(){onPick(c);rp();
        row.querySelectorAll('.color-dot').forEach(function(x){x.classList.remove('sel');});
        d.classList.add('sel');
      };
      row.appendChild(d);
    });
    parent.appendChild(row);
  }

  /* helper: icon picker button */
  function addIconPick(parent,label,getIcon,setIcon){
    var row=document.createElement('div');
    row.style.cssText='display:flex;gap:6px;align-items:center;margin-bottom:7px';
    var lbl=document.createElement('div');
    lbl.style.cssText='font-size:10px;color:var(--muted);font-family:sans-serif;width:30px;flex-shrink:0';
    lbl.textContent=label;
    var wrap=document.createElement('div');wrap.className='icon-picker-wrap';wrap.style.flex='1';
    var btn=document.createElement('div');btn.className='icon-preview-btn';
    var btnId='ipb'+Math.random().toString(36).slice(2);btn.id=btnId;
    var ico=document.createElement('i');ico.className='ti '+getIcon();
    var sp=document.createElement('span');sp.style.cssText='font-size:11px;font-family:sans-serif;color:var(--muted)';
    sp.textContent=getIcon();
    btn.appendChild(ico);btn.appendChild(sp);
    btn.onclick=function(e){
      e.stopPropagation();
      showIP(btnId,getIcon(),function(ic){
        setIcon(ic);ico.className='ti '+ic;sp.textContent=ic;rp();
      });
    };
    wrap.appendChild(btn);row.appendChild(lbl);row.appendChild(wrap);parent.appendChild(row);
  }

  /* ── toggle helper ── */
  function addToggle(parent,labelText,getVal,setVal){
    var row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:.5px solid var(--border)';
    var sp=document.createElement('span');sp.style.fontSize='12px';sp.textContent=labelText;
    var label=document.createElement('label');label.className='tog';
    var inp=document.createElement('input');inp.type='checkbox';inp.checked=getVal();
    inp.onchange=function(){setVal(this.checked);rp();};
    var slider=document.createElement('span');slider.className='togslider';
    label.appendChild(inp);label.appendChild(slider);
    row.appendChild(sp);row.appendChild(label);parent.appendChild(row);
  }

function pf(label,id,val){
  return '<div><div class="ef-label" style="margin-bottom:4px">'+label+'</div><input class="fi" id="'+id+'" value="'+val+'"></div>';
}

function saveProject(id){
  var isNew=(id==='new');
  var obj={
    id:isNew?(PROJECTS.length?Math.max.apply(null,PROJECTS.map(function(x){return x.id;}))+1:1):id,
    n:document.getElementById('pn').value,
    c:document.getElementById('pc').value,
    d:document.getElementById('pd').value,
    budget:+document.getElementById('pb').value||0,
    p:Math.min(100,Math.max(0,+document.getElementById('pp').value||0)),
    s:document.getElementById('ps').value,
    note:document.getElementById('pnote').value
  };
  if(isNew){PROJECTS.push(obj);}
  else{var idx=PROJECTS.findIndex(function(x){return x.id===id;});if(idx>=0)PROJECTS[idx]=obj;}
  editingProjId=null;toast('專案已儲存');renderProjects();
}

function delProject(id){
  if(!confirm('確定刪除此專案？'))return;
  PROJECTS=PROJECTS.filter(function(x){return x.id!==id;});
  toast('已刪除');renderProjects();
}

function saveMember(id){
  var isNew=(id==='new');
  var obj={
    id:isNew?(TEAM_MEMBERS.length?Math.max.apply(null,TEAM_MEMBERS.map(function(x){return x.id;}))+1:1):id,
    name:document.getElementById('mname').value,
    init:document.getElementById('minit').value||document.getElementById('mname').value.charAt(0),
    role:document.getElementById('mrole').value,
    email:document.getElementById('memail').value,
    phone:document.getElementById('mphone').value,
    color:document.getElementById('mcolor').value
  };
  if(isNew){TEAM_MEMBERS.push(obj);}
  else{var idx=TEAM_MEMBERS.findIndex(function(x){return x.id===id;});if(idx>=0)TEAM_MEMBERS[idx]=obj;}
  /* sync SC.team for website preview */
  SC.team=TEAM_MEMBERS.map(function(m){return {name:m.name,role:m.role,color:m.color,init:m.init};});
  editingMemberId=null;toast('成員已儲存');renderTeam();
}

function delMember(id){
  if(!confirm('確定刪除此成員？'))return;
  TEAM_MEMBERS=TEAM_MEMBERS.filter(function(x){return x.id!==id;});
  SC.team=TEAM_MEMBERS.map(function(m){return {name:m.name,role:m.role,color:m.color,init:m.init};});
  toast('已刪除');renderTeam();
}

      +'<div style="font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;font-family:sans-serif;margin-bottom:3px">'+m.k+'</div>'

var _lbImgs=[], _lbIdx=0;

function lbOpen(imgs, idx){
  _lbImgs=imgs; _lbIdx=idx;
  lbShow();
  var ov=document.getElementById('lightbox-overlay');
  if(ov) ov.classList.add('open');
}

function lbShow(){
  var img=document.getElementById('lightbox-img');
  var ctr=document.getElementById('lightbox-counter');
  var prev=document.getElementById('lightbox-prev');
  var next=document.getElementById('lightbox-next');
  if(!img) return;
  img.style.opacity='0';
  img.src=_lbImgs[_lbIdx];
  img.onload=function(){img.style.opacity='1';};
  if(ctr) ctr.textContent=(_lbIdx+1)+' / '+_lbImgs.length;
  if(prev) prev.style.visibility=_lbImgs.length>1?'visible':'hidden';
  if(next) next.style.visibility=_lbImgs.length>1?'visible':'hidden';
}

function lbStep(dir){
  _lbIdx=(_lbIdx+dir+_lbImgs.length)%_lbImgs.length;
  lbShow();
}

function lbHide(){
  var ov=document.getElementById('lightbox-overlay');
  if(ov) ov.classList.remove('open');
}

function lbClose(e){
  if(e.target.id==='lightbox-overlay') lbHide();
}

/* keyboard nav */
document.addEventListener('keydown',function(e){
  var ov=document.getElementById('lightbox-overlay');
  if(!ov||!ov.classList.contains('open')) return;
  if(e.key==='ArrowLeft') lbStep(-1);
  else if(e.key==='ArrowRight') lbStep(1);
  else if(e.key==='Escape') lbHide();
});

function exportSettings(){
  var data={
    SC: SC,
    PORTFOLIO: PORTFOLIO.map(function(p){
      return {id:p.id,name:p.name,cat:p.cat,catName:p.catName,area:p.area,year:p.year,color:p.color,desc:p.desc||'',imgs:p.imgs};
    }),
    PROJECTS: PROJECTS,
    TEAM_MEMBERS: TEAM_MEMBERS,
    FINANCE: FINANCE
  };
  var json=JSON.stringify(data,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='uja-studio-settings.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('設定已匯出');
}

function importSettings(){
  var input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var data=JSON.parse(ev.target.result);
        if(data.SC) Object.assign(SC, data.SC);
        if(data.PORTFOLIO) PORTFOLIO=data.PORTFOLIO;
        if(data.PROJECTS) PROJECTS=data.PROJECTS;
        if(data.TEAM_MEMBERS){
          TEAM_MEMBERS=data.TEAM_MEMBERS;
          SC.team=TEAM_MEMBERS.map(function(m){return {name:m.name,role:m.role,color:m.color,init:m.init};});
        }
        if(data.FINANCE) FINANCE=data.FINANCE;
        /* apply accent color */
        if(SC.accentColor) document.documentElement.style.setProperty('--accent',SC.accentColor);
        toast('設定已匯入！正在重新載入...');
        setTimeout(function(){showSec('web-editor');},800);
      } catch(err){
        toast('匯入失敗：檔案格式錯誤');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}
