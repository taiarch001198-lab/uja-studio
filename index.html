<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UJA Studio Architect</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
:root{
  --bg:#0A0A0A;--bg1:#111111;--bg2:#181818;
  --text:#F0EDE8;--text2:#A8A49C;--text3:#686460;
  --accent:#D4AA60;--line:rgba(255,255,255,0.12);--line2:rgba(255,255,255,0.22);
  --sans:'Helvetica Neue',Arial,sans-serif;
  --serif:'Georgia',serif;
  --danger:#C04444;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;}
#app{min-height:100vh;}
.pg{display:none;}.pg.on{display:block;}

/* NAV */
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 52px;height:64px;background:rgba(10,10,10,.92);backdrop-filter:blur(16px);border-bottom:.5px solid var(--line);}
.logo{cursor:pointer;display:flex;align-items:baseline;gap:8px;}
.logo-main{font-size:13px;letter-spacing:4px;color:var(--text);font-weight:400;text-transform:uppercase;}
.logo-sub{font-size:9px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;}
.nav-links{display:flex;align-items:center;gap:36px;}
.nl{font-size:10px;letter-spacing:3px;color:var(--text3);cursor:pointer;border:none;background:none;text-transform:uppercase;transition:color .25s;font-family:var(--sans);}
.nl:hover,.nl.on{color:var(--text);}
#navauth{display:flex;align-items:center;gap:12px;}
.nav-btn{background:none;border:.5px solid var(--line2);color:var(--text2);padding:7px 16px;font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:var(--sans);transition:all .2s;}
.nav-btn:hover{border-color:var(--text);color:var(--text);}
.nav-btn-fill{background:var(--accent);border:.5px solid var(--accent);color:#0A0A0A;padding:7px 16px;font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:var(--sans);transition:opacity .2s;}
.nav-btn-fill:hover{opacity:.8;}

/* PUBLIC SECTIONS */
.hero-sec{min-height:calc(100vh - 64px);display:flex;flex-direction:column;justify-content:flex-end;padding:80px 52px;background:var(--bg);}
.hero-tag{font-size:9px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:32px;}
.hero-title{font-size:clamp(40px,6vw,80px);font-weight:300;line-height:1.15;letter-spacing:-1px;color:var(--text);font-family:var(--serif);margin-bottom:28px;}
.hero-title em{font-style:italic;color:var(--accent);}
.hero-desc{font-size:13px;color:var(--text2);line-height:1.9;max-width:460px;margin-bottom:48px;}
.hero-actions{display:flex;gap:16px;align-items:center;}
.btn-primary{background:var(--accent);color:#0A0A0A;border:none;padding:13px 32px;font-size:9px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;font-family:var(--sans);text-decoration:none;display:inline-block;transition:opacity .2s;}
.btn-primary:hover{opacity:.8;}
.btn-ghost{background:none;color:var(--text2);border:.5px solid var(--line2);padding:13px 32px;font-size:9px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;font-family:var(--sans);text-decoration:none;display:inline-block;transition:all .2s;}
.btn-ghost:hover{border-color:var(--text);color:var(--text);}
.btn-white{background:var(--text);color:#0A0A0A;padding:13px 32px;font-size:9px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;font-family:var(--sans);text-decoration:none;display:inline-block;border:none;white-space:nowrap;}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--line);margin-top:60px;}
.stat{padding:28px 0;border-right:.5px solid var(--line);}
.stat:last-child{border-right:none;}
.stat-num{font-size:28px;font-style:italic;color:var(--text);font-family:var(--serif);}
.stat-lbl{font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-top:6px;}
.about-sec{padding:120px 52px;border-top:.5px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start;}
.sec-label{font-size:9px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:24px;}
.sec-title{font-size:clamp(24px,3vw,38px);font-weight:300;line-height:1.3;font-family:var(--serif);color:var(--text);margin-bottom:24px;}
.sec-title em{font-style:italic;color:var(--accent);}
.sec-body{font-size:13px;color:var(--text2);line-height:2;}
.services-sec{padding:100px 52px;border-top:.5px solid var(--line);}
.service-row{display:grid;grid-template-columns:60px 1fr 1fr;gap:32px;align-items:start;padding:32px 0;border-top:.5px solid var(--line);}
.service-row:last-child{border-bottom:.5px solid var(--line);}
.service-num{font-size:11px;color:var(--text3);font-style:italic;font-family:var(--serif);padding-top:2px;}
.service-name{font-size:18px;font-weight:300;color:var(--text);font-family:var(--serif);}
.service-desc{font-size:12px;color:var(--text2);line-height:1.9;}
.process-sec{padding:100px 52px;border-top:.5px solid var(--line);}
.process-list{margin-top:60px;display:grid;grid-template-columns:repeat(4,1fr);}
.process-item{padding:40px 32px;border-right:.5px solid var(--line);}
.process-item:last-child{border-right:none;}
.process-num{font-size:40px;font-style:italic;color:var(--text3);font-family:var(--serif);margin-bottom:20px;}
.process-name{font-size:14px;color:var(--text);margin-bottom:12px;font-family:var(--serif);}
.process-desc{font-size:12px;color:var(--text2);line-height:1.9;}
.team-sec{padding:100px 52px;border-top:.5px solid var(--line);}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:60px;}
.team-av{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-style:italic;color:#0A0A0A;font-family:var(--serif);}
.team-name{font-size:16px;font-family:var(--serif);font-weight:300;color:var(--text);margin-top:16px;}
.team-role{font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-top:4px;}
.cta-sec{padding:100px 52px;border-top:.5px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;}
.cta-title{font-size:clamp(24px,3vw,40px);font-weight:300;font-family:var(--serif);color:var(--text);line-height:1.2;}
.cta-title em{font-style:italic;color:var(--accent);}
.cta-sub{font-size:12px;color:var(--text2);margin-top:12px;line-height:1.8;}
.port-sec{padding:100px 52px;border-top:.5px solid var(--line);}
.port-filter{display:flex;gap:28px;margin-top:40px;}
.pf-btn{font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;cursor:pointer;background:none;border:none;font-family:var(--sans);padding-bottom:4px;border-bottom:.5px solid transparent;transition:all .2s;}
.pf-btn.on,.pf-btn:hover{color:var(--text);border-bottom-color:var(--accent);}
.port-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:60px;}
.port-item{position:relative;overflow:hidden;cursor:pointer;aspect-ratio:4/3;background:var(--bg1);}
.port-item img{width:100%;height:100%;object-fit:cover;transition:transform .6s;}
.port-item:hover img{transform:scale(1.04);}
.port-overlay{position:absolute;bottom:0;left:0;right:0;padding:24px 20px;background:linear-gradient(transparent,rgba(0,0,0,.8));transform:translateY(100%);transition:transform .35s;}
.port-item:hover .port-overlay{transform:translateY(0);}
.port-cat{font-size:9px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.port-name{font-size:15px;color:var(--text);font-family:var(--serif);}
.port-meta{font-size:11px;color:var(--text2);margin-top:4px;}
.port-empty{grid-column:1/-1;padding:80px;text-align:center;font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;}

/* FOOTER */
footer{padding:64px 52px 36px;border-top:.5px solid var(--line);}
.footer-top{display:grid;grid-template-columns:2fr 1fr 1fr;gap:60px;margin-bottom:48px;}
.footer-brand{font-size:13px;letter-spacing:4px;color:var(--text);text-transform:uppercase;margin-bottom:14px;}
.footer-tagline{font-size:12px;color:var(--text3);line-height:1.9;max-width:240px;}
.footer-col-title{font-size:9px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:18px;}
.footer-info{font-size:12px;color:var(--text2);line-height:2.2;}
.footer-hr-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:.5px solid var(--line);}
.footer-hr-row:last-child{border-bottom:none;}
.footer-hr-day{color:var(--text3);}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:24px;border-top:.5px solid var(--line);font-size:10px;color:var(--text3);letter-spacing:1px;}
.f-link{color:var(--text3);cursor:pointer;transition:color .2s;font-size:10px;letter-spacing:1px;}
.f-link:hover{color:var(--text2);}

/* CONTACT */
.contact-sec{padding:100px 52px;border-top:.5px solid var(--line);}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:60px;align-items:start;}
.contact-form{display:flex;flex-direction:column;gap:20px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-field{display:flex;flex-direction:column;gap:8px;}
.form-field label{font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;}
.form-inp{background:none;border:none;border-bottom:.5px solid var(--line2);padding:10px 0;font-size:13px;color:var(--text);font-family:var(--sans);outline:none;transition:border-color .2s;width:100%;}
.form-inp:focus{border-bottom-color:var(--accent);}
select.form-inp option{background:var(--bg1);}
textarea.form-inp{resize:none;height:80px;}
.contact-info{display:flex;flex-direction:column;gap:28px;}
.ci-key{font-size:9px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.ci-val{font-size:13px;color:var(--text2);line-height:1.9;}

/* PORT DETAIL */
.detail-hero{width:100%;height:62vh;object-fit:cover;display:block;}
.detail-placeholder{width:100%;height:62vh;background:var(--bg2);}
.detail-body{padding:60px 52px;}
.detail-tag{font-size:9px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:16px;}
.detail-title{font-size:clamp(28px,4vw,52px);font-weight:300;font-family:var(--serif);color:var(--text);line-height:1.2;margin-bottom:28px;}
.detail-meta{display:flex;gap:40px;padding:24px 0;border-top:.5px solid var(--line);border-bottom:.5px solid var(--line);margin-bottom:40px;}
.dm-key{font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:6px;}
.dm-val{font-size:13px;color:var(--text);}
.detail-desc{font-size:13px;color:var(--text2);line-height:2;max-width:640px;margin-bottom:52px;}
.detail-gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;}
.detail-gallery img{width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in;transition:opacity .2s;}
.detail-gallery img:hover{opacity:.75;}
.detail-cta{margin-top:80px;padding:52px;border:.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.back-link{font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;cursor:pointer;transition:color .2s;background:none;border:none;font-family:var(--sans);}
.back-link:hover{color:var(--text2);}

/* LEGAL */
.legal-body{padding:80px 52px;max-width:760px;}
.legal-title{font-size:32px;font-weight:300;font-family:var(--serif);color:var(--text);margin-bottom:48px;}
.legal-h3{font-size:9px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin:32px 0 12px;}
.legal-p{font-size:13px;color:var(--text2);line-height:2;margin-bottom:12px;}

/* LOGIN */
.login-page{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.login-box{width:100%;max-width:360px;}
.login-title{font-size:24px;font-family:var(--serif);font-weight:300;color:var(--text);margin-bottom:6px;}
.login-sub{font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:36px;padding-bottom:24px;border-bottom:.5px solid var(--line);}
.login-err{font-size:11px;color:var(--danger);margin-bottom:16px;display:none;}
.login-field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px;}
.login-field label{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);}
.login-inp{background:none;border:none;border-bottom:.5px solid var(--line2);color:var(--text);padding:10px 0;font-size:13px;font-family:var(--sans);outline:none;width:100%;transition:border-color .2s;}
.login-inp:focus{border-bottom-color:var(--accent);}
.login-rem{display:flex;align-items:center;gap:9px;margin-bottom:24px;}
.login-rem input{accent-color:var(--accent);}
.login-rem label{font-size:10px;color:var(--text3);cursor:pointer;letter-spacing:.5px;}
.login-btn{width:100%;background:var(--accent);color:#0A0A0A;border:none;padding:13px;font-size:9px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;font-family:var(--sans);}
.login-hint{margin-top:14px;font-size:10px;color:var(--text3);text-align:center;padding:10px;background:var(--bg1);cursor:pointer;border:.5px solid transparent;transition:border-color .2s;}
.login-hint:hover{border-color:var(--line2);}
.login-back{text-align:center;margin-top:14px;font-size:10px;color:var(--text3);cursor:pointer;letter-spacing:1px;}
.login-back:hover{color:var(--text2);}

/* LIGHTBOX */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
#lb.on{opacity:1;pointer-events:all;}
#lb-img{max-width:88vw;max-height:86vh;object-fit:contain;transition:opacity .2s;}
#lb-close{position:fixed;top:20px;right:26px;background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;font-family:var(--sans);letter-spacing:2px;z-index:2001;text-transform:uppercase;}
#lb-close:hover{color:var(--text);}
#lb-prev,#lb-next{position:fixed;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);font-size:24px;cursor:pointer;padding:20px;z-index:2001;}
#lb-prev{left:10px;}#lb-next{right:10px;}
#lb-prev:hover,#lb-next:hover{color:var(--text);}
#lb-count{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:3px;color:var(--text3);}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:.5px solid var(--line2);color:var(--text);padding:12px 20px;font-size:10px;letter-spacing:1px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
.toast.on{opacity:1;}

/* APP SHELL */
.app-shell{display:flex;height:calc(100vh - 64px);overflow:hidden;}
.sidebar{width:200px;background:var(--bg1);border-right:.5px solid var(--line);padding:12px 0;flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column;}
.sb-brand{padding:16px 20px 18px;border-bottom:.5px solid var(--line);margin-bottom:8px;}
.sb-bname{font-size:11px;letter-spacing:3px;color:var(--text2);text-transform:uppercase;}
.sb-bname span{color:var(--accent);}
.sb-bsub{font-size:8px;letter-spacing:2px;color:var(--text3);margin-top:3px;text-transform:uppercase;}
.sb-dot-row{display:flex;align-items:center;gap:6px;margin-top:10px;}
.sb-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
.sb-status{font-size:9px;color:var(--accent);letter-spacing:1px;}
.sb-sec{font-size:8px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;padding:8px 20px 4px;margin-top:8px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:11px;color:var(--text3);cursor:pointer;border-left:1.5px solid transparent;letter-spacing:.5px;transition:all .15s;}
.sb-item:hover{color:var(--text);background:var(--bg2);}
.sb-item.on{color:var(--text);background:var(--bg2);border-left-color:var(--accent);}
.sb-footer{margin-top:auto;padding:16px 20px;border-top:.5px solid var(--line);}
.mainarea{flex:1;overflow-y:auto;padding:28px 32px;background:var(--bg);}

/* EDITOR */
.ed-wrap{display:grid;grid-template-columns:260px 1fr;gap:16px;height:calc(100vh - 64px - 88px);}
.ed-left{overflow-y:auto;display:flex;flex-direction:column;gap:1px;scrollbar-width:thin;scrollbar-color:var(--accent) var(--bg1);}
.ed-group{background:var(--bg1);border:.5px solid var(--line);overflow:hidden;}
.ed-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;font-size:10px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;transition:background .15s;user-select:none;}
.ed-head:hover,.ed-head.open{background:var(--bg2);color:var(--text2);}
.ed-chev{font-size:9px;transition:transform .2s;}
.ed-head.open .ed-chev{transform:rotate(90deg);color:var(--accent);}
.ed-body{padding:14px;border-top:.5px solid var(--line);display:none;}
.ed-body.open{display:block;}
.ed-label{font-size:8px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:5px;}
.ed-inp{width:100%;background:var(--bg2);border:.5px solid var(--line);color:var(--text);padding:8px 10px;font-size:12px;font-family:var(--serif);outline:none;transition:border-color .2s;margin-bottom:10px;}
.ed-inp:focus{border-color:var(--accent);}
textarea.ed-inp{resize:vertical;min-height:58px;}
.ed-inp:last-child{margin-bottom:0;}
.ed-field{margin-bottom:12px;}
.ed-field:last-child{margin-bottom:0;}
.ed-preview{border:.5px solid var(--line);overflow:hidden;display:flex;flex-direction:column;}
.ed-prev-bar{background:var(--bg1);padding:9px 14px;border-bottom:.5px solid var(--line);font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;display:flex;justify-content:space-between;}
.ed-prev-body{flex:1;overflow-y:auto;font-size:.65em;scrollbar-width:thin;scrollbar-color:var(--accent) var(--bg1);}
.ed-tog-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:.5px solid var(--line);}
.ed-tog-row:last-child{border-bottom:none;}
.ed-tog-lbl{font-size:11px;color:var(--text2);}
.tgl{position:relative;width:32px;height:17px;flex-shrink:0;}
.tgl input{opacity:0;width:0;height:0;}
.tgl-sl{position:absolute;inset:0;background:var(--bg2);border-radius:9px;cursor:pointer;border:.5px solid var(--line2);}
.tgl-sl:before{content:"";position:absolute;width:12px;height:12px;left:2px;top:2px;background:var(--text3);border-radius:50%;transition:all .2s;}
input:checked+.tgl-sl{background:rgba(184,152,88,.15);border-color:rgba(184,152,88,.4);}
input:checked+.tgl-sl:before{transform:translateX(15px);background:var(--accent);}
.csw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s;}
.csw:hover,.csw.on{border-color:var(--text);}
.pal-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
.hrs-row{display:grid;grid-template-columns:90px 1fr 24px;gap:6px;align-items:center;margin-bottom:6px;}
.hrs-inp{background:var(--bg2);border:.5px solid var(--line);color:var(--text);padding:6px 8px;font-size:11px;outline:none;width:100%;}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);padding:8px 12px;border-bottom:.5px solid var(--line);text-align:left;font-weight:400;}
.tbl td{padding:12px;border-bottom:.5px solid var(--line);font-size:12px;color:var(--text2);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--bg2);}
.bdg{font-size:8px;padding:3px 10px;letter-spacing:1px;text-transform:uppercase;}
.bdg-g{background:rgba(80,140,80,.12);color:#7AAA7A;}
.bdg-a{background:rgba(184,152,88,.12);color:var(--accent);}
.bdg-gr{background:rgba(100,100,100,.12);color:#777;}

/* QUOTE */
.q-row{display:grid;grid-template-columns:1.8fr .5fr .7fr .8fr 24px;gap:6px;align-items:center;padding:8px 0;border-bottom:.5px solid var(--line);}
.q-hdr{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);}
.q-inp{width:100%;background:var(--bg2);border:.5px solid var(--line);color:var(--text);padding:6px 8px;font-size:11px;outline:none;}

/* FINANCE */
.fin-inp{background:var(--bg2);border:.5px solid var(--line);color:var(--text);padding:5px 8px;font-size:11px;outline:none;text-align:right;width:120px;}

/* UPLOAD */
.drop-zone{border:.5px dashed var(--line2);padding:28px;text-align:center;cursor:pointer;transition:background .2s;}
.drop-zone:hover,.drop-zone.dov{background:var(--bg2);}
.img-thumb{position:relative;width:72px;height:72px;overflow:hidden;border:.5px solid var(--line);}
.img-thumb img{width:100%;height:100%;object-fit:cover;}
.img-rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.8);border:none;width:16px;height:16px;cursor:pointer;color:var(--text2);font-size:10px;display:flex;align-items:center;justify-content:center;}
.img-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}

/* MODAL */
.modal-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.modal-field label{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);}
.modal-inp{background:var(--bg2);border:.5px solid var(--line);color:var(--text);padding:9px 11px;font-size:12px;font-family:var(--sans);outline:none;width:100%;}
.modal-inp:focus{border-color:var(--accent);}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* SAVE IND */
#save-ind{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:.5px solid var(--line2);color:var(--accent);font-size:9px;letter-spacing:2px;padding:8px 14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:998;text-transform:uppercase;}

/* MOBILE */
@media(max-width:768px){
  nav{padding:0 20px;}
  .logo-sub{display:none;}
  .hero-sec{padding:52px 24px;}
  .hero-title{font-size:32px;}
  .hero-stats{grid-template-columns:repeat(2,1fr);}
  .about-sec{grid-template-columns:1fr;gap:40px;padding:60px 24px;}
  .services-sec,.process-sec,.team-sec,.cta-sec,.port-sec{padding:60px 24px;}
  .service-row{grid-template-columns:1fr;gap:10px;}
  .service-num{display:none;}
  .process-list{grid-template-columns:1fr 1fr;}
  .team-grid{grid-template-columns:1fr 1fr;}
  .cta-sec{flex-direction:column;gap:28px;}
  .port-grid{grid-template-columns:1fr 1fr;}
  footer{padding:48px 24px 28px;}
  .footer-top{grid-template-columns:1fr;gap:32px;}
  .footer-bottom{flex-direction:column;gap:12px;text-align:center;}
  .contact-sec{padding:60px 24px;}
  .contact-grid{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
  .detail-body{padding:36px 24px;}
  .detail-cta{flex-direction:column;gap:20px;padding:32px 24px;}
  .detail-gallery{grid-template-columns:repeat(2,1fr);}
  .legal-body{padding:48px 24px;}
  .app-shell{flex-direction:column;height:auto;}
  .sidebar{width:100%;height:auto;}
  .ed-wrap{grid-template-columns:1fr;height:auto;}
  .ed-preview{display:none;}
  .mainarea{padding:16px;}
}
@media(max-width:480px){
  .port-grid{grid-template-columns:1fr;}
  .process-list{grid-template-columns:1fr;}
  .hero-title{font-size:26px;}
}

/* SLIDESHOW */
.slide-bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:#0A0A0A;}
.slide-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease;pointer-events:none;}
.slide-bg img.on{opacity:1;}
.slide-overlay{position:absolute;inset:0;z-index:1;pointer-events:none;}
.hero-sec{position:relative;}
.hero-sec .hero-tag,.hero-sec .hero-title,.hero-sec .hero-desc,.hero-sec .hero-actions,.hero-sec .hero-stats{position:relative;z-index:2;}
.slide-dots{position:absolute;bottom:28px;left:52px;z-index:3;display:flex;gap:8px;align-items:center;}
.slide-dot{width:20px;height:1px;background:rgba(255,255,255,.3);cursor:pointer;transition:all .3s;}
.slide-dot.on{width:32px;background:var(--accent);}
.slide-progress{position:absolute;bottom:0;left:0;height:2px;background:var(--accent);z-index:3;transition:width linear;}
@media(max-width:768px){.slide-dots{left:24px;bottom:20px;}}

/* ABOUT CAROUSEL */
.about-carousel{position:relative;overflow:hidden;background:var(--bg1);aspect-ratio:4/3;}
.about-carousel-track{display:flex;transition:transform .6s cubic-bezier(.4,0,.2,1);}
.about-carousel-slide{flex-shrink:0;width:100%;aspect-ratio:4/3;overflow:hidden;}
.about-carousel-slide img{width:100%;height:100%;object-fit:cover;display:block;}
.about-carousel-slide .slide-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg2);}
.about-carousel-prev,.about-carousel-next{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(10,10,10,.5);border:none;color:rgba(255,255,255,.6);
  font-size:18px;cursor:pointer;padding:12px 14px;z-index:2;
  transition:all .2s;backdrop-filter:blur(4px);
}
.about-carousel-prev{left:0;}
.about-carousel-next{right:0;}
.about-carousel-prev:hover,.about-carousel-next:hover{background:rgba(10,10,10,.8);color:#fff;}
.about-carousel-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;z-index:2;}
.about-carousel-dot{width:18px;height:1.5px;background:rgba(255,255,255,.3);cursor:pointer;transition:all .25s;}
.about-carousel-dot.on{width:28px;background:var(--accent);}
.about-carousel-counter{position:absolute;top:12px;right:14px;font-size:9px;
  letter-spacing:2px;color:rgba(255,255,255,.5);font-family:var(--sans);z-index:2;}
</style>

// AUTH
function fillLogin(){document.getElementById('li-u').value=CU;document.getElementById('li-p').value=CP;}
function doLogin(){
  var u=document.getElementById('li-u').value.trim(),p=document.getElementById('li-p').value;
  if(u===CU&&p===CP){
    loggedIn=true;document.getElementById('login-err').style.display='none';
    var rem=document.getElementById('li-rem');
    if(rem&&rem.checked){try{localStorage.setItem('uja_u',u);localStorage.setItem('uja_p',p);}catch(e){}}
    else{try{localStorage.removeItem('uja_u');localStorage.removeItem('uja_p');}catch(e){}}
    renderNavAuth();gp('app');renderSidebar();showSec('web-editor');
  }else{document.getElementById('login-err').style.display='block';}
}
function doLogout(){loggedIn=false;renderNavAuth();gp('home');}

function renderNavAuth(){
  var el=document.getElementById('navauth');if(!el)return;el.innerHTML='';
  if(!loggedIn){
    var b=document.createElement('button');b.className='nav-btn';
    b.innerHTML=si(P.lock,11)+'員工登入';b.onclick=function(){gp('login');};el.appendChild(b);
  }else{
    var dot=document.createElement('span');dot.style.cssText='width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block';
    var nm=document.createElement('span');nm.style.cssText='font-size:9px;letter-spacing:1px;color:var(--accent)';nm.textContent=SC.bMain;
    var db=document.createElement('button');db.className='nav-btn';db.innerHTML=si(P.pencil,11)+'後台管理';db.onclick=function(){gp('app');showSec('web-editor');};
    var lb=document.createElement('button');lb.className='nav-btn';lb.innerHTML=si(P.logout,11);lb.onclick=doLogout;
    el.appendChild(dot);el.appendChild(nm);el.appendChild(db);el.appendChild(lb);
  }
}

// ROUTING
function gp(id,data){
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on');});
  var pg=document.getElementById('pg-'+id);if(!pg)return;
  pg.classList.add('on');
  ['home','port','contact'].forEach(function(k){var e=document.getElementById('nl-'+k);if(e)e.classList.remove('on');});
  window.scrollTo(0,0);
  if(id==='home'){var e=document.getElementById('nl-home');if(e)e.classList.add('on');renderHome();}
  if(id==='port'){var e=document.getElementById('nl-port');if(e)e.classList.add('on');renderPubPort();document.getElementById('port-footer').innerHTML=buildFooter();}
  if(id==='contact'){var e=document.getElementById('nl-contact');if(e)e.classList.add('on');renderContactInfo();document.getElementById('contact-footer').innerHTML=buildFooter();}
  if(id==='port-detail'&&data!==undefined)renderPortDetail(data);
  if(id==='privacy')renderLegal('privacy');
  if(id==='terms')renderLegal('terms');
}
function navPort(i){gp('port-detail',i);}
function navPrivacy(){gp('privacy');}
function navTerms(){gp('terms');}

// FOOTER STORAGE
function saveFooter(){
  try{localStorage.setItem(FOOTER_KEY,JSON.stringify({tagline:SC.footer.tagline,address:SC.footer.address,phone:SC.footer.phone,email:SC.footer.email,instagram:SC.footer.instagram,copyright:SC.footer.copyright,hours:SC.footer.hours}));}catch(e){}
  var ind=document.getElementById('save-ind');
  if(ind){ind.style.opacity='1';clearTimeout(ind._t);ind._t=setTimeout(function(){ind.style.opacity='0';},1600);}
}
function loadFooter(){
  try{
    var raw=localStorage.getItem(FOOTER_KEY);if(!raw)return;
    var d=JSON.parse(raw);
    ['tagline','address','phone','email','instagram','copyright'].forEach(function(k){if(d[k]!==undefined)SC.footer[k]=d[k];});
    if(d.hours)SC.footer.hours=d.hours;
  }catch(e){}
}

// BUILD FOOTER
function buildFooter(){
  var f=SC.footer;
  var h='<footer><div class="footer-top">';
  h+='<div><div class="footer-brand">'+SC.bMain+' <span style="font-size:9px;letter-spacing:2px;color:var(--text3)">'+SC.bSub+'</span></div>';
  h+='<div class="footer-tagline">'+f.tagline+'</div></div>';
  h+='<div><div class="footer-col-title">Contact</div>';
  h+='<div class="footer-info">'+f.address+'<br>'+f.phone+'<br>'+f.email+(f.instagram?'<br>'+f.instagram:'')+'</div></div>';
  h+='<div><div class="footer-col-title">Hours</div>';
  f.hours.forEach(function(hr){
    h+='<div class="footer-hr-row"><span class="footer-hr-day">'+hr.day+'</span>';
    h+=(hr.closed?'<span style="color:var(--text3)">休息</span>':'<span style="color:var(--text2)">'+hr.time+'</span>');
    h+='</div>';
  });
  h+='</div></div>';
  h+='<div class="footer-bottom"><span>'+f.copyright+'</span>';
  h+='<div style="display:flex;gap:20px">';
  h+='<span class="f-link" onclick="navPrivacy()">Privacy</span>';
  h+='<span class="f-link" onclick="navTerms()">Terms</span>';
  if(loggedIn){h+='<span class="f-link" onclick="gp(\'app\');showSec(\'web-editor\')">Admin</span>';}
  else{h+='<span class="f-link" onclick="gp(\'login\')">Staff Login</span>';}
  h+='</div></div></footer>';
  return h;
}
function buildFooterMini(){
  var f=SC.footer;
  return '<footer style="padding:20px;border-top:.5px solid var(--line);font-size:.85em">'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:14px">'
    +'<div><div style="font-size:8px;letter-spacing:2px;color:var(--text2);margin-bottom:5px">'+SC.bMain+'</div>'
    +'<div style="font-size:8px;color:var(--text3);line-height:1.7">'+f.tagline+'</div></div>'
    +'<div><div style="font-size:7px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:5px">Contact</div>'
    +'<div style="font-size:8px;color:var(--text3);line-height:1.7">'+f.address+'<br>'+f.phone+'</div></div>'
    +'<div><div style="font-size:7px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:5px">Hours</div>'
    +f.hours.map(function(hr){return '<div style="display:flex;justify-content:space-between;font-size:7px;color:var(--text3);padding:2px 0"><span>'+hr.day+'</span><span>'+(hr.closed?'休息':hr.time)+'</span></div>';}).join('')
    +'</div></div>'
    +'<div style="border-top:.5px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;font-size:7px;color:var(--text3)">'
    +'<span>'+f.copyright+'</span><span>Privacy · Terms</span></div></footer>';
}

    h+='<div class="hero-actions" style="'+(m?'gap:8px':'')+'"">';

    h+='<div class="sec-label" style="'+(m?'font-size:7px':'')+'">Services</div>';
    h+='<div class="sec-title" style="'+(m?'font-size:14px':'')+'">服務項目</div>';

      h+='<div class="service-row" style="'+(m?'grid-template-columns:1fr;gap:6px;padding:14px 0':'')+'"">';
      if(!m)h+='<div class="service-num">'+sv.num+'</div>';
      h+='<div class="service-name" style="'+(m?'font-size:11px':'')+'">'+sv.name+'</div>';
      h+='<div class="service-desc" style="'+(m?'font-size:8px':'')+'">'+sv.desc+'</div></div>';
    });

  }
  if(SC.vis.process){
    h+='<section class="process-sec" style="'+(m?'padding:24px 20px':'')+'"">';
    h+='<div class="sec-label" style="'+(m?'font-size:7px':'')+'">Process</div>';

    h+='<div class="process-list" style="'+(m?'grid-template-columns:repeat(2,1fr);margin-top:20px':'')+'"">';

        +'<div class="team-av" style="background:'+tm.color+';'+(m?'width:34px;height:34px;font-size:13px':'')+'">'+tm.init+'</div>'

  if(SC.vis.cta){
    h+='<section class="cta-sec" style="'+(m?'flex-direction:column;gap:20px;padding:24px 20px':'')+'"">';

    h+='<div class="cta-sub" style="'+(m?'font-size:9px':'')+'">'+SC.cta.sub+'</div></div>';
    if(m){h+='<div style="background:var(--accent);color:#0A0A0A;padding:10px 18px;font-size:8px;letter-spacing:2px;text-transform:uppercase;align-self:flex-start">'+SC.cta.btn+'</div>';}
    else{h+='<a class="btn-primary" onclick="gp(\'contact\');return false;" href="#">'+SC.cta.btn+'</a>';}
    h+='</section>';
  }
  if(!m)h+=buildFooter();
  return h;
}

/* ── SLIDESHOW ── */
var _ssIdx=0, _ssTimer=null, _ssEl=null;

function ssInit(){
  var hero=document.querySelector('.hero-sec');if(!hero)return;
  /* remove old */
  var old=document.getElementById('slide-bg-el');if(old)old.remove();
  var oldOverlay=document.getElementById('slide-overlay-el');if(oldOverlay)oldOverlay.remove();
  var oldDots=document.getElementById('slide-dots-el');if(oldDots)oldDots.remove();
  var oldProg=document.getElementById('slide-prog-el');if(oldProg)oldProg.remove();

  var imgs=SC.slideshow&&SC.slideshow.imgs?SC.slideshow.imgs:[];
  var overlay=SC.slideshow&&SC.slideshow.overlay!==undefined?SC.slideshow.overlay:0.55;

  /* background container */
  var bg=document.createElement('div');bg.className='slide-bg';bg.id='slide-bg-el';
  imgs.forEach(function(src,i){
    var img=document.createElement('img');img.src=src;if(i===0)img.classList.add('on');bg.appendChild(img);
  });
  hero.insertBefore(bg,hero.firstChild);

  /* overlay */
  var ov=document.createElement('div');ov.className='slide-overlay';ov.id='slide-overlay-el';
  ov.style.background='rgba(0,0,0,'+overlay+')';hero.insertBefore(ov,hero.children[1]);

  /* dots */
  if(imgs.length>1){
    var dots=document.createElement('div');dots.className='slide-dots';dots.id='slide-dots-el';
    imgs.forEach(function(_,i){
      var d=document.createElement('div');d.className='slide-dot'+(i===0?' on':'');
      (function(idx){d.onclick=function(){ssGo(idx);};})(i);
      dots.appendChild(d);
    });
    hero.appendChild(dots);
  }

  /* progress bar */
  var prog=document.createElement('div');prog.id='slide-prog-el';prog.className='slide-progress';
  prog.style.width='0%';hero.appendChild(prog);

  _ssIdx=0;_ssEl={bg:bg,ov:ov};
  ssAutoPlay();
}

function ssGo(idx){
  if(!_ssEl)return;
  var imgs=SC.slideshow&&SC.slideshow.imgs?SC.slideshow.imgs:[];
  if(!imgs.length)return;
  _ssIdx=(idx+imgs.length)%imgs.length;
  _ssEl.bg.querySelectorAll('img').forEach(function(img,i){img.classList.toggle('on',i===_ssIdx);});
  var dots=document.getElementById('slide-dots-el');
  if(dots)dots.querySelectorAll('.slide-dot').forEach(function(d,i){d.classList.toggle('on',i===_ssIdx);});
  ssResetProgress();
}

function ssAutoPlay(){
  clearInterval(_ssTimer);clearTimeout(_ssTimer);
  var imgs=SC.slideshow&&SC.slideshow.imgs?SC.slideshow.imgs:[];
  if(imgs.length<2)return;
  var interval=SC.slideshow&&SC.slideshow.interval?SC.slideshow.interval:5000;
  ssResetProgress();
  _ssTimer=setInterval(function(){ssGo(_ssIdx+1);},interval);
}

function ssResetProgress(){
  var prog=document.getElementById('slide-prog-el');if(!prog)return;
  var interval=SC.slideshow&&SC.slideshow.interval?SC.slideshow.interval:5000;
  prog.style.transition='none';prog.style.width='0%';
  setTimeout(function(){prog.style.transition='width '+interval+'ms linear';prog.style.width='100%';},30);
}

function ssDestroy(){clearInterval(_ssTimer);clearTimeout(_ssTimer);}

/* ── ABOUT CAROUSEL ── */
var _acIdx=0;

function acInit(){
  var c=document.getElementById('about-carousel');if(!c)return;
  var imgs=SC.slideshow&&SC.slideshow.imgs?SC.slideshow.imgs:[];
  /* also use portfolio images if slideshow is empty */
  if(!imgs.length){
    PORTFOLIO.forEach(function(p){if(p.imgs&&p.imgs.length)imgs=imgs.concat(p.imgs.slice(0,2));});
  }
  if(!imgs.length){
    c.innerHTML='<div class="about-carousel-slide"><div class="slide-empty"><span style="font-size:9px;letter-spacing:2px;color:var(--text3)">上傳作品照片後即可顯示</span></div></div>';
    return;
  }
  _acIdx=0;
  var track=document.createElement('div');track.className='about-carousel-track';track.id='ac-track';
  imgs.forEach(function(src){
    var slide=document.createElement('div');slide.className='about-carousel-slide';
    var img=document.createElement('img');img.src=src;img.alt='';
    slide.appendChild(img);track.appendChild(slide);
  });
  /* counter */
  var ctr=document.createElement('div');ctr.className='about-carousel-counter';ctr.id='ac-ctr';
  ctr.textContent='1 / '+imgs.length;
  /* prev/next */
  var prev=document.createElement('button');prev.className='about-carousel-prev';
  prev.innerHTML='&#8249;';prev.onclick=function(){acStep(-1);};
  var next=document.createElement('button');next.className='about-carousel-next';
  next.innerHTML='&#8250;';next.onclick=function(){acStep(1);};
  /* dots */
  var dotsEl=document.createElement('div');dotsEl.className='about-carousel-dots';dotsEl.id='ac-dots';
  imgs.forEach(function(_,i){
    var d=document.createElement('div');d.className='about-carousel-dot'+(i===0?' on':'');
    (function(idx){d.onclick=function(){acGo(idx);};})(i);
    dotsEl.appendChild(d);
  });
  c.innerHTML='';
  c.appendChild(track);if(imgs.length>1){c.appendChild(prev);c.appendChild(next);}
  c.appendChild(dotsEl);c.appendChild(ctr);
  /* auto play */
  clearInterval(c._timer);
  if(imgs.length>1){
    c._timer=setInterval(function(){acStep(1);},4000);
  }
}

function acStep(dir){
  var track=document.getElementById('ac-track');if(!track)return;
  var n=track.children.length;
  _acIdx=(_acIdx+dir+n)%n;
  acGo(_acIdx);
}

function acGo(idx){
  var track=document.getElementById('ac-track');if(!track)return;
  _acIdx=idx;
  track.style.transform='translateX(-'+(_acIdx*100)+'%)';
  var dots=document.getElementById('ac-dots');
  if(dots)dots.querySelectorAll('.about-carousel-dot').forEach(function(d,i){d.classList.toggle('on',i===_acIdx);});
  var ctr=document.getElementById('ac-ctr');
  if(ctr)ctr.textContent=(_acIdx+1)+' / '+track.children.length;
}

function pimgs(files){

function savePort(){

function qrow(it,i){return '<div class="q-row"><input class="q-inp" value="'+it.desc+'" oninput="qData.items['+i+'].desc=this.value"><input class="q-inp" value="'+it.unit+'" oninput="qData.items['+i+'].unit=this.value"><input class="q-inp" type="number" value="'+it.qty+'" oninput="qData.items['+i+'].qty=+this.value;uqt()" style="text-align:right"><input class="q-inp" type="number" value="'+it.price+'" oninput="qData.items['+i+'].price=+this.value;uqt()" style="text-align:right"><button style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px" onclick="delQR('+i+')">×</button></div>';}
function qtot(){return qData.items.reduce(function(s,it){return s+it.qty*it.price;},0);}
function uqt(){var el=document.getElementById('q-total');if(el)el.textContent='NT$ '+qtot().toLocaleString();}
function addQR(){qData.items.push({desc:'',unit:'式',qty:1,price:0});renderQuote();}
function delQR(i){qData.items.splice(i,1);renderQuote();}
function genPDF(){
  if(typeof window.jspdf==='undefined'){toast('PDF 載入中…');return;}
  var{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
  var W=210,tot=qtot(),tax=Math.round(tot*.05),date=document.getElementById('qdate').value;
  doc.setFillColor(20,20,20);doc.rect(0,0,W,36,'F');
  doc.setFont('helvetica','normal');doc.setFontSize(14);doc.setTextColor(220,215,205);doc.text(SC.bMain,14,16);
  doc.setFontSize(7);doc.setTextColor(120,110,90);doc.text(SC.bSub,14,23);
  doc.setFontSize(13);doc.setTextColor(184,152,88);doc.text('QUOTATION',W-14,14,{align:'right'});
  doc.setFontSize(7);doc.setTextColor(100,100,90);doc.text(date,W-14,21,{align:'right'});
  var y=44;doc.setFillColor(24,24,24);doc.rect(14,y,W-28,20,'F');
  doc.setFontSize(7);doc.setTextColor(100,100,90);doc.text('CLIENT',16,y+6);doc.setFontSize(10);doc.setTextColor(220,215,205);doc.text(qData.client||'—',16,y+14);
  doc.setFontSize(7);doc.setTextColor(100,100,90);doc.text('PROJECT',80,y+6);doc.setFontSize(10);doc.setTextColor(220,215,205);doc.text(qData.project||'—',80,y+14);
  y+=28;
  doc.autoTable({startY:y,head:[['Description','Unit','Qty','Unit Price','Total']],
    body:qData.items.map(function(it){return[it.desc,it.unit,it.qty+'','NT$'+it.price.toLocaleString(),'NT$'+(it.qty*it.price).toLocaleString()];}),
    theme:'plain',headStyles:{fillColor:[20,20,20],textColor:[184,152,88],fontSize:7,cellPadding:4},
    bodyStyles:{fontSize:9,textColor:[180,175,165],cellPadding:5},alternateRowStyles:{fillColor:[18,18,18]},
    columnStyles:{2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}},margin:{left:14,right:14}});
  y=doc.lastAutoTable.finalY+10;
  doc.setDrawColor(50,50,50);doc.line(14,y,W-14,y);y+=8;
  doc.setFontSize(8);doc.setTextColor(100,100,90);doc.text('Subtotal',W-70,y,{align:'right'});doc.setTextColor(180,175,165);doc.text('NT$'+tot.toLocaleString(),W-14,y,{align:'right'});y+=7;
  doc.setTextColor(100,100,90);doc.text('Tax 5%',W-70,y,{align:'right'});doc.setTextColor(180,175,165);doc.text('NT$'+tax.toLocaleString(),W-14,y,{align:'right'});y+=10;
  doc.setFillColor(184,152,88);doc.rect(W-80,y-6,66,10,'F');doc.setTextColor(20,20,20);doc.setFontSize(10);doc.text('NT$'+(tot+tax).toLocaleString(),W-14,y+0.5,{align:'right'});
  y+=20;doc.setFillColor(20,20,20);doc.rect(14,y,W-28,12,'F');doc.setFontSize(7);doc.setTextColor(100,100,90);

// TEAM
function renderTeam(){
  var ma=document.getElementById('mainarea');
  if(editingMemberId!==null){renderMemEdit(editingMemberId);return;}
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">'
    +'<div style="font-size:16px;font-family:var(--serif);font-weight:300;color:var(--text)">Team</div>'
    +'<button class="nav-btn-fill" style="font-size:9px" onclick="editingMemberId=\'new\';renderTeam()">+ Add</button></div>';
  if(!TEAM_MEMBERS.length){h+='<div style="padding:60px;text-align:center;font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase">No members yet</div>';}
  else{
    h+='<table class="tbl"><thead><tr><th>姓名</th><th>職稱</th><th>電子信箱</th><th>電話</th><th></th></tr></thead><tbody>';
    TEAM_MEMBERS.forEach(function(m){
      h+='<tr><td><div style="display:flex;align-items:center;gap:10px"><div style="width:28px;height:28px;border-radius:50%;background:'+m.color+';display:flex;align-items:center;justify-content:center;font-size:11px;font-style:italic;color:#0A0A0A;flex-shrink:0">'+m.init+'</div><span style="color:var(--text)">'+m.name+'</span></div></td>'
        +'<td>'+m.role+'</td><td>'+m.email+'</td><td>'+m.phone+'</td>'
        +'<td style="white-space:nowrap"><button class="nav-btn" style="font-size:9px;margin-right:4px" onclick="editingMemberId='+m.id+';renderTeam()">編輯</button>'
        +'<button style="background:none;border:.5px solid rgba(192,68,68,.3);color:var(--danger);padding:4px 10px;font-size:9px;cursor:pointer" onclick="delMem('+m.id+')">Del</button></td></tr>';
    });
    h+='</tbody></table>';
  }
  ma.innerHTML=h;
}
function renderMemEdit(id){
  var isNew=(id==='new');
  var m=isNew?{id:null,name:'',init:'',role:'',email:'',phone:'',color:'#888060'}:TEAM_MEMBERS.find(function(x){return x.id===id;});
  var h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">'
    +'<button class="nav-btn" onclick="editingMemberId=null;renderTeam()" style="font-size:9px">← Back</button>'
    +'<div style="font-size:16px;font-family:var(--serif);font-weight:300;color:var(--text)">'+(isNew?'新增成員':'編輯成員')+'</div></div>';
  h+='<div style="max-width:520px">';
  h+='<div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">'
    +'<div id="mem-av" style="width:52px;height:52px;border-radius:50%;background:'+m.color+';display:flex;align-items:center;justify-content:center;font-size:20px;font-style:italic;color:#0A0A0A">'+m.init+'</div>'
    +'<div><div class="ed-label" style="margin-bottom:6px">Avatar Color</div><div class="pal-row">';
  PAL.slice(0,10).forEach(function(c){h+='<div class="csw'+(m.color===c?' on':'')+'" style="background:'+c+'" onclick="document.getElementById(\'mcolor\').value=\''+c+'\';document.getElementById(\'mem-av\').style.background=\''+c+'\';this.parentElement.querySelectorAll(\'.csw\').forEach(function(x){x.classList.remove(\'on\')});this.classList.add(\'on\')"></div>';});
  h+='</div></div></div>';
  h+='<input type="hidden" id="mcolor" value="'+m.color+'">';
  h+='<div class="modal-grid" style="margin-bottom:14px">'+mf2('姓名','mname',m.name)+mf2('縮寫（頭像）','minit',m.init)+'</div>';
  h+='<div style="margin-bottom:14px"><div class="ed-label" style="margin-bottom:6px">Role</div><input class="modal-inp" id="mrole" value="'+m.role+'"></div>';
  h+='<div class="modal-grid" style="margin-bottom:20px">'+mf2('電子信箱','memail',m.email)+mf2('電話','mphone',m.phone)+'</div>';
  h+='<div style="display:flex;gap:10px"><button class="nav-btn-fill" style="font-size:9px" onclick="saveMem('+(isNew?'\'new\'':m.id)+')">儲存</button><button class="nav-btn" style="font-size:9px" onclick="editingMemberId=null;renderTeam()">取消</button></div>';
  h+='</div>';
  document.getElementById('mainarea').innerHTML=h;
  var ni=document.getElementById('mname'),ii=document.getElementById('minit');
  if(ni&&ii)ni.oninput=function(){if(!ii.value)ii.value=this.value.charAt(0);var av=document.getElementById('mem-av');if(av&&!ii.value)av.textContent=this.value.charAt(0);};
  if(ii)ii.oninput=function(){var av=document.getElementById('mem-av');if(av)av.textContent=this.value;};
}
function saveMem(id){
  var isNew=(id==='new');
  var obj={id:isNew?(TEAM_MEMBERS.length?Math.max.apply(null,TEAM_MEMBERS.map(function(x){return x.id;}))+1:1):id,
    name:document.getElementById('mname').value,init:document.getElementById('minit').value||document.getElementById('mname').value.charAt(0),
    role:document.getElementById('mrole').value,email:document.getElementById('memail').value,
    phone:document.getElementById('mphone').value,color:document.getElementById('mcolor').value};
  if(isNew)TEAM_MEMBERS.push(obj);else{var i=TEAM_MEMBERS.findIndex(function(x){return x.id===id;});if(i>=0)TEAM_MEMBERS[i]=obj;}
  SC.team=TEAM_MEMBERS.map(function(m){return{name:m.name,role:m.role,color:m.color,init:m.init};});
  editingMemberId=null;toast('已儲存');renderTeam();
}
function delMem(id){if(!confirm('確定刪除此成員？'))return;TEAM_MEMBERS=TEAM_MEMBERS.filter(function(x){return x.id!==id;});SC.team=TEAM_MEMBERS.map(function(m){return{name:m.name,role:m.role,color:m.color,init:m.init};});toast('已刪除');renderTeam();}

// FINANCE
function renderFinance(){
  var ma=document.getElementById('mainarea');
  var tot=FINANCE.monthly.reduce(function(s,r){return s+r.income;},0);
  var last=FINANCE.monthly.length>0?FINANCE.monthly[FINANCE.monthly.length-1]:{income:0,expense:0};
  var h='<div style="font-size:16px;font-family:var(--serif);font-weight:300;color:var(--text);margin-bottom:20px">Finance</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-bottom:24px">';
  [{l:'本月收款',v:'NT$'+last.income.toLocaleString()},{l:'年度累計',v:'NT$'+tot.toLocaleString()},{l:'待收款',v:'NT$'+FINANCE.pending.toLocaleString()}].forEach(function(c){
    h+='<div style="background:var(--bg1);padding:24px"><div style="font-size:8px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:8px">'+c.l+'</div>'
      +'<div style="font-size:22px;font-style:italic;font-family:var(--serif);color:var(--text)">'+c.v+'</div></div>';
  });
  h+='</div>';
  h+='<div style="background:var(--bg1);border:.5px solid var(--line);margin-bottom:16px">';
  h+='<div style="padding:14px 16px;border-bottom:.5px solid var(--line);display:flex;justify-content:space-between;align-items:center">';
  h+='<div style="font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase">Monthly Records</div>';
  h+='<button class="nav-btn" style="font-size:9px" onclick="addFinRow()">+ Add Month</button></div>';
  if(FINANCE.monthly.length){
    h+='<table class="tbl"><thead><tr><th>月份</th><th>收款（NT$）</th><th>支出（NT$）</th><th>淨利</th><th></th></tr></thead><tbody>';
    FINANCE.monthly.forEach(function(row,i){h+=finRow(row,i);});
    h+='</tbody></table>';
  }else{h+='<div style="padding:32px;text-align:center;font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase">No records yet</div>';}
  h+='</div>';
  h+='<div class="modal-grid"><div class="modal-field"><label>待收款金額（NT$）</label><input class="modal-inp" type="number" id="fin-pend" value="'+FINANCE.pending+'" oninput="FINANCE.pending=+this.value"></div>';
  h+='<div class="modal-field"><label>備註</label><input class="modal-inp" id="fin-note" value="'+FINANCE.note+'" oninput="FINANCE.note=this.value"></div></div>';
  ma.innerHTML=h;
}
function finRow(row,i){var net=row.income-row.expense;return '<tr><td><input class="fin-inp" value="'+row.month+'" style="width:70px;text-align:left" oninput="FINANCE.monthly['+i+'].month=this.value"></td><td><input class="fin-inp" type="number" value="'+row.income+'" oninput="FINANCE.monthly['+i+'].income=+this.value;renderFinance()"></td><td><input class="fin-inp" type="number" value="'+row.expense+'" oninput="FINANCE.monthly['+i+'].expense=+this.value;renderFinance()"></td><td style="font-size:11px;color:'+(net>=0?'#7AAA7A':'var(--danger)')+'">'+net.toLocaleString()+'</td><td><button style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px" onclick="FINANCE.monthly.splice('+i+',1);renderFinance()">×</button></td></tr>';}
function addFinRow(){FINANCE.monthly.push({month:'',income:0,expense:0});renderFinance();}

// DOWNLOAD HTML
function downloadHTML(){
  var xhr=new XMLHttpRequest();
  xhr.open('GET',window.location.href,true);
  xhr.onload=function(){
    if(xhr.status!==200){toast('下載失敗，請重試');return;}
    var src=xhr.responseText;
    src=src.replace(/<script id="uja-data">[\s\S]*?<\/script>/g,'');
    var data={SC:SC,PORTFOLIO:PORTFOLIO.map(function(p){return{id:p.id,name:p.name,cat:p.cat,catName:p.catName,area:p.area,year:p.year,color:p.color||'#888',desc:p.desc||'',imgs:p.imgs};}),PROJECTS:PROJECTS,TEAM_MEMBERS:TEAM_MEMBERS,FINANCE:FINANCE};
    var rs='<script id="uja-data">\n(function(){\nvar d='+JSON.stringify(data)+';\ndocument.addEventListener("DOMContentLoaded",function(){\ntry{Object.assign(SC,d.SC);PORTFOLIO=d.PORTFOLIO;PROJECTS=d.PROJECTS;TEAM_MEMBERS=d.TEAM_MEMBERS;SC.team=d.TEAM_MEMBERS.map(function(m){return{name:m.name,role:m.role,color:m.color,init:m.init};});FINANCE=d.FINANCE;if(SC.accent)document.documentElement.style.setProperty("--accent",SC.accent);}catch(e){}\n});\n})();\n<\/script>';
    src=src.replace('</body>',rs+'\n</body>');
    var blob=new Blob([src],{type:'text/html;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';a.click();URL.revokeObjectURL(a.href);
    toast('index.html 已下載');
  };
  xhr.onerror=function(){toast('下載失敗，請重試');};
  xhr.send();
}
